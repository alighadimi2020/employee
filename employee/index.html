<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل من | Ario Tjarat</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-right"><button class="mobile-menu" id="menuBtn">☰</button><div><span class="eyebrow">Employee Workspace</span><h1>داشبورد من</h1><p>اطلاعات واقعی ثبت‌شده برای حساب شما</p></div></div><div class="date-box"><span id="timeNow"></span><strong id="dateNow"></strong></div></header><div id="content"></div></main></div><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>const s=requireRole("employee");if(s){renderLayout("dashboard","employee");const e=getCurrentEmployee(),d=getSystemData();const mine=d.reports.filter(r=>r.employeeId===e.id);content.innerHTML=`<section class="hero"><div><span class="eyebrow">Personal Workspace</span><h2>سلام، ${escapeHTML(e.name)}</h2><p>وضعیت حضور و عملکرد فقط از داده‌های ثبت‌شده نمایش داده می‌شود.</p></div><div class="hero-score"><span>امتیاز</span><strong>${e.score==null?"—":e.score}</strong></div></section><section class="stats-grid"><div class="metric"><span>رتبه</span><strong>—</strong><small>تا زمان ثبت داده عملکرد</small></div><div class="metric"><span>فعالیت امروز</span><strong>${formatDuration(e.activeSeconds)}</strong><small>ثبت‌شده</small></div><div class="metric"><span>تماس امروز</span><strong>${formatDuration(e.callSeconds)}</strong><small>ثبت‌شده</small></div><div class="metric"><span>حضور</span><strong>${e.attendancePercent==null?"—":e.attendancePercent+"%"}</strong><small>داده ثبت‌شده</small></div></section><section class="grid-2"><article class="panel"><div class="panel-head"><div><span class="eyebrow">Reports</span><h2>آخرین گزارش‌های من</h2></div><a class="muted" href="reports.html">مشاهده ←</a></div>${mine.length?`<div class="report-list">${mine.slice(0,4).map(r=>`<div class="report-row"><div class="employee-avatar">گ</div><div><b>${escapeHTML(r.title)}</b><p>${escapeHTML(r.date)} · ${escapeHTML(r.text)}</p></div><span class="tag">ثبت شده</span></div>`).join("")}</div>`:'<div class="empty">هنوز گزارشی ثبت نکرده‌اید.</div>'}</article><article class="panel"><div class="panel-head"><div><span class="eyebrow">Status</span><h2>وضعیت حضور</h2></div></div><div class="notice">وضعیت فعلی: ${statusLabel(e.status)}</div><div style="height:10px"></div><a class="primary-btn" href="attendance.html">اسکن QR و ثبت حضور</a></article></section>`;}</script></body></html>
