<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رتبه‌بندی | Ario Tjarat</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-right"><button class="mobile-menu" id="menuBtn">☰</button><div><span class="eyebrow">Ranking</span><h1>رتبه‌بندی</h1><p>فقط اطلاعاتی که واقعاً ثبت شده نمایش داده می‌شود</p></div></div></header><section class="panel"><div class="panel-head"><div><span class="eyebrow">Leaderboard</span><h2>رتبه‌بندی فعلی</h2></div></div><div id="list"></div></section></main></div><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>const s=requireRole("employee");if(s){renderLayout("ranking","employee");const d=getSystemData(),ranked=d.employees.filter(e=>e.score!=null).sort((a,b)=>b.score-a.score);list.innerHTML=ranked.length?ranked.map((e,i)=>`<div class="employee-row"><div class="employee-avatar">${e.name.replace("آقای ","").replace("خانم ","").slice(0,1)}</div><div><b>${escapeHTML(e.name)}</b><span>${i+1===1?"رتبه اول":`رتبه ${i+1}`}</span></div><strong>${e.score}</strong></div>`).join(""):'<div class="empty">تا زمانی که امتیاز عملکرد ثبت نشود، رتبه‌بندی قابل محاسبه نیست.</div>'}</script></body></html>
