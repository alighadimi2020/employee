<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل | Ario Tjarat</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-right"><button class="mobile-menu" id="menuBtn">☰</button><div><span class="eyebrow">Profile</span><h1>پروفایل من</h1><p>اطلاعات حساب شما</p></div></div></header><section class="panel"><div id="profile"></div></section></main></div><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>const s=requireRole("employee");if(s){renderLayout("profile","employee");const e=getCurrentEmployee();profile.innerHTML=`<div style="display:flex;align-items:center;gap:15px"><div class="employee-avatar" style="width:62px;height:62px;font-size:20px">${e.name.slice(-3,-2)}</div><div><span class="eyebrow">Employee</span><h2 style="margin:4px 0">${escapeHTML(e.name)}</h2><span class="muted">${escapeHTML(e.role)}</span></div></div><div style="height:20px"></div><div class="notice">نام کاربری: ${escapeHTML(e.username)} · وضعیت: ${statusLabel(e.status)}</div>`}</script></body></html>
