<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل کارمند | Ario Tjarat</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-right"><button class="mobile-menu" id="menuBtn">☰</button><div><span class="eyebrow">Employee Profile</span><h1 id="title">پروفایل کارمند</h1><p>نمایش اطلاعات ثبت‌شده و گزارش‌های کاری</p></div></div><div class="date-box"><span id="timeNow"></span><strong id="dateNow"></strong></div></header><div id="profile"></div></main></div><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>
requireRole("manager");renderLayout("employees","manager");
const id=new URLSearchParams(location.search).get("id"),e=getEmployee(id),d=getSystemData();
if(!e){document.getElementById("profile").innerHTML='<section class="panel empty">کارمند پیدا نشد.</section>'}else{
 document.getElementById("title").textContent=e.name;
 const reports=d.reports.filter(r=>r.employeeId===e.id), attendance=d.attendance.filter(r=>r.employeeId===e.id);
 document.getElementById("profile").innerHTML=`<section class="hero"><div><span class="eyebrow">Employee</span><h2>${escapeHTML(e.name)}</h2><p>${escapeHTML(e.role)} · نام کاربری ${escapeHTML(e.username)}</p></div><div class="hero-score"><span>امتیاز</span><strong>${e.score==null?"—":e.score}</strong></div></section>
 <section class="stats-grid"><div class="metric"><span>حضور</span><strong>${e.attendancePercent==null?"—":e.attendancePercent+"%"}</strong></div><div class="metric"><span>فعالیت</span><strong>${formatDuration(e.activeSeconds)}</strong></div><div class="metric"><span>تماس</span><strong>${formatDuration(e.callSeconds)}</strong></div><div class="metric"><span>وضعیت</span><strong>${statusLabel(e.status)}</strong></div></section>
 <section class="grid-2"><article class="panel"><div class="panel-head"><div><span class="eyebrow">Reports</span><h2>گزارش‌های کاری</h2></div><button class="small-btn" onclick="downloadEmployeePDF('${e.id}')">دانلود PDF</button></div>${reports.length?`<div class="report-list">${reports.map(r=>`<div class="report-row"><div class="employee-avatar">گ</div><div><b>${escapeHTML(r.title)}</b><p>${escapeHTML(r.date)} · ${escapeHTML(r.text)}</p></div><span class="tag">ثبت شده</span></div>`).join("")}</div>`:'<div class="empty">گزارشی ثبت نشده است.</div>'}</article><article class="panel"><div class="panel-head"><div><span class="eyebrow">Attendance</span><h2>سوابق حضور</h2></div></div>${attendance.length?attendance.slice().reverse().map(r=>`<div class="attendance-row"><span>${escapeHTML(r.date)}</span><span>ورود</span><span>${escapeHTML(r.time)}</span><span class="status present">QR</span></div>`).join(""):'<div class="empty">سابقه حضور ثبت نشده است.</div>'}</article></section>`;
}
function downloadEmployeePDF(id){
 const e=getEmployee(id),d=getSystemData(),reports=d.reports.filter(r=>r.employeeId===id),attendance=d.attendance.filter(r=>r.employeeId===id),w=window.open("","_blank","width=900,height=700");if(!w)return;
 w.document.write(`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش ${escapeHTML(e.name)}</title><style>body{font-family:Tahoma,Arial;padding:40px;line-height:1.9;color:#17221f}h1{font-size:24px}h2{font-size:17px;border-bottom:1px solid #ddd;padding-bottom:6px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #ddd;padding:10px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:right}</style></head><body><h1>گزارش عملکرد — ${escapeHTML(e.name)}</h1><p>${faDate()} — ${faTime()}</p><div class="meta"><div class="box">نقش: ${escapeHTML(e.role)}</div><div class="box">امتیاز: ${e.score==null?"—":e.score}</div><div class="box">حضور: ${e.attendancePercent==null?"—":e.attendancePercent+"%"}</div><div class="box">وضعیت: ${statusLabel(e.status)}</div></div><h2>گزارش‌های کاری</h2>${reports.length?`<table><tr><th>تاریخ</th><th>عنوان</th><th>شرح</th></tr>${reports.map(r=>`<tr><td>${escapeHTML(r.date)}</td><td>${escapeHTML(r.title)}</td><td>${escapeHTML(r.text)}</td></tr>`).join("")}</table>`:"<p>گزارشی ثبت نشده است.</p>"}<h2>حضور</h2>${attendance.length?`<table><tr><th>تاریخ</th><th>ساعت</th></tr>${attendance.map(r=>`<tr><td>${escapeHTML(r.date)}</td><td>${escapeHTML(r.time)}</td></tr>`).join("")}</table>`:"<p>سابقه‌ای ثبت نشده است.</p>"}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close();
}
</script></body></html>
