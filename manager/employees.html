<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کارکنان | Ario Tjarat</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-right"><button class="mobile-menu" id="menuBtn">☰</button><div><span class="eyebrow">Employees</span><h1>مدیریت کارکنان</h1><p>پروفایل و داده‌های ثبت‌شده هر کارمند</p></div></div></header><section class="panel"><div class="panel-head"><div><span class="eyebrow">Directory</span><h2>فهرست کارکنان</h2></div><span class="muted">جزئیات خصوصی عملکرد فقط برای مدیر نمایش داده می‌شود</span></div><table class="table"><thead><tr><th>کارمند</th><th>نقش</th><th>امتیاز</th><th>حضور</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="employeeRows"></tbody></table></section></main></div><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>
requireRole("manager");renderLayout("employees","manager");
const d=getSystemData();
document.getElementById("employeeRows").innerHTML=d.employees.map(e=>`<tr><td><b>${escapeHTML(e.name)}</b></td><td>${escapeHTML(e.role)}</td><td>${e.score==null?"—":e.score}</td><td>${e.attendancePercent==null?"—":e.attendancePercent+"%"}</td><td><span class="status ${e.status==="present"?"present":""}">${statusLabel(e.status)}</span></td><td><div class="action-buttons"><a class="small-btn" href="employee-profile.html?id=${encodeURIComponent(e.id)}">مشاهده پروفایل</a><button class="small-btn" onclick="downloadEmployeePDF('${e.id}')">دانلود PDF</button></div></td></tr>`).join("");
function downloadEmployeePDF(id){
 const e=getEmployee(id), d=getSystemData(), reports=d.reports.filter(r=>r.employeeId===id), attendance=d.attendance.filter(r=>r.employeeId===id);
 const w=window.open("","_blank","width=900,height=700"); if(!w)return;
 w.document.write(`<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش ${escapeHTML(e.name)}</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:40px;color:#17221f;line-height:1.9}h1{font-size:25px}h2{font-size:17px;border-bottom:1px solid #ddd;padding-bottom:8px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid #ddd;border-radius:10px;padding:12px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:right}@media print{button{display:none}}</style></head><body><h1>گزارش عملکرد کارکنان — ${escapeHTML(e.name)}</h1><p>تاریخ تهیه: ${faDate()} — ساعت: ${faTime()}</p><div class="meta"><div class="box">نقش: ${escapeHTML(e.role)}</div><div class="box">امتیاز: ${e.score==null?"—":e.score}</div><div class="box">حضور: ${e.attendancePercent==null?"—":e.attendancePercent+"%"}</div><div class="box">وضعیت: ${statusLabel(e.status)}</div></div><h2>گزارش‌های کاری</h2>${reports.length?`<table><tr><th>تاریخ</th><th>عنوان</th><th>شرح</th></tr>${reports.map(r=>`<tr><td>${escapeHTML(r.date)}</td><td>${escapeHTML(r.title)}</td><td>${escapeHTML(r.text)}</td></tr>`).join("")}</table>`:"<p>گزارشی ثبت نشده است.</p>"}<h2>حضور و غیاب</h2>${attendance.length?`<table><tr><th>تاریخ</th><th>نوع</th><th>ساعت</th></tr>${attendance.map(r=>`<tr><td>${escapeHTML(r.date)}</td><td>ورود</td><td>${escapeHTML(r.time)}</td></tr>`).join("")}</table>`:"<p>سابقه‌ای ثبت نشده است.</p>"}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
 w.document.close();
}
</script></body></html>
