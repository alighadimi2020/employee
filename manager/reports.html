<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش‌ها | Ario Tjarat</title><link rel="stylesheet" href="../css/app.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar"><div class="topbar-right"><button class="mobile-menu" id="menuBtn">☰</button><div><span class="eyebrow">Reports</span><h1>گزارش‌های کارکنان</h1><p>گزارش‌هایی که کارکنان واقعاً ثبت کرده‌اند</p></div></div></header><section class="panel"><div class="panel-head"><div><span class="eyebrow">Live data</span><h2>سوابق گزارش</h2></div></div><div id="reportList"></div></section></main></div><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/layout.js"></script><script>requireRole("manager");renderLayout("reports","manager");const d=getSystemData(),reportList=document.getElementById("reportList");reportList.innerHTML=d.reports.length?d.reports.map(r=>`<div class="report-row"><div class="employee-avatar">${escapeHTML(r.employeeName.slice(0,1))}</div><div><b>${escapeHTML(r.title)}</b><p>${escapeHTML(r.employeeName)} · ${escapeHTML(r.date)} · ${escapeHTML(r.text)}</p></div><span class="tag">ثبت شده</span></div>`).join(""):'<div class="empty">هنوز هیچ گزارش کاری ثبت نشده است.</div>';</script></body></html>
